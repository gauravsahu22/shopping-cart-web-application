name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 is chosen because it bundles npm 11, which this project requires:
  # the lockfile is in the npm 11 format and npm 10 rejects it outright
  # ("Missing: @emnapi/runtime from lock file"). Node 22.12 bundles npm 10, so
  # it would need an upgrade step that has to run before `npm ci` — one less
  # moving part this way. Angular 21 supports ^20.19 || ^22.12 || >=24.
  NODE_VERSION: '24'
  NPM_VERSION: '11'

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use a compatible npm
        # Belt and braces: Node 24 already ships npm 11, but this guards against
        # a future runner image shipping something older, and prints the version
        # so a dependency failure is diagnosable from the log alone.
        run: |
          if [ "$(npm -v | cut -d. -f1)" -lt "${{ env.NPM_VERSION }}" ]; then
            npm install --global npm@${{ env.NPM_VERSION }}
          fi
          echo "node $(node -v) / npm $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        # Coverage thresholds are configured in angular.json; this step fails if
        # coverage drops below them.
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Audit runtime dependencies
        # Advisories in the production dependency tree fail the build; dev-only
        # advisories are reported without blocking, since they never ship.
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit || true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The suite drives the real Fake Store API, so it is kept in its own job:
    # a third-party outage should read as "E2E failed", not "the build is broken".
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use a compatible npm
        # Belt and braces: Node 24 already ships npm 11, but this guards against
        # a future runner image shipping something older, and prints the version
        # so a dependency failure is diagnosable from the log alone.
        run: |
          if [ "$(npm -v | cut -d. -f1)" -lt "${{ env.NPM_VERSION }}" ]; then
            npm install --global npm@${{ env.NPM_VERSION }}
          fi
          echo "node $(node -v) / npm $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # `playwright.config.ts` starts the dev server itself via `webServer`.
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
